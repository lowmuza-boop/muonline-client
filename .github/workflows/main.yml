
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK Command-line Tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$RUNNER_TEMP"
          curl -fL -o commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p android-tools
          unzip -q commandlinetools.zip -d android-tools
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -a android-tools/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Check Android project
        run: |
          if [ ! -f MuAndroid/MuAndroid.csproj ]; then
            echo "ERROR: MuAndroid/MuAndroid.csproj not found"
            echo "Project files:"
            find . -maxdepth 4 -name '*.csproj' -print
            exit 1
          fi

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: |
          dotnet restore MuAndroid/MuAndroid.csproj \
            -p:AndroidSdkDirectory="$ANDROID_HOME"

      - name: Publish Android APK
        run: |
          dotnet publish MuAndroid/MuAndroid.csproj \
            -c Release \
            -f net10.0-android \
            -o publish-android \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:AndroidPackageFormat=apk

      - name: Find generated APK
        run: |
          find publish-android -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muonline-android-apk
          path: publish-android/**/*.apk
          if-no-files-found: error
          retention-days: 7
