
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository files
        run: |
          echo "Repository files:"
          ls -la
          echo "Android build files:"
          find . -maxdepth 4 \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \) -print
